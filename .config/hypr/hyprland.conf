# --------------- BASICO ---------------
$mainMod = SUPER

env = QT_QPA_PLATFORMTHEME,qt6ct

exec-once = caelestia shell -d
# hyprpaper desactivado: Caelestia dibuja su propio fondo y lo tapaba
# exec-once = waybar
exec-once = nm-applet &
exec-once = wl-paste --watch clipbox --store &
exec-once = hypridle &
exec-once = udiskie &

monitor = ,preferred,auto,1.25
input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10 10 0 10
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 0.70
    rounding = 0
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = yes
}

# --------------- LAYOUT DWINDLE ---------------
dwindle {
    preserve_split = yes
}

# --------------- KEYBINDS ---------------
bind = $mainMod, SPACE, exec, caelestia shell drawers toggle launcher
bind = $mainMod, RETURN, exec, kitty
bind = CTRL, SPACE, exec, rofi -show drun

bind = $mainMod SHIFT, S, exec, caelestia shell picker openFreezeClip
bind = , Print, exec, caelestia screenshot -f
bind = SHIFT, Print, exec, caelestia screenshot -r -f
bind = $mainMod, E, exec, dolphin

bind = $mainMod, Q, killactive
bind = $mainMod, V, exec, rofi -i -modi 'clipboard:/usr/bin/clipbox' -show clipboard -theme ~/.config/rofi/theme.rasi -kb-element-next '' -kb-custom-1 'Tab' -kb-custom-2 'Alt+1' -kb-custom-3 'Alt+2' -kb-custom-4 'Alt+3' -kb-custom-5 'Alt+4' -kb-custom-6 'Alt+5' -kb-custom-7 'Alt+d' -kb-mode-next '' -kb-custom-9 'Control+Tab'
bind = $mainMod, F, fullscreen
bind = $mainMod, P, exec, /home/ronald/.local/bin/monitor-switch
bind = $mainMod, M, exit
bind = $mainMod, L, exec, qs -c caelestia ipc call lock lock
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, G, movetoworkspace, special
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop

bind = $mainMod, N, exec, caelestia shell nexus open
bind = $mainMod, period, exec, caelestia emoji -p
bind = $mainMod SHIFT, V, togglefloating
bind = $mainMod CTRL, N, exec, caelestia shell notifs clear
bind = $mainMod, B, exec, caelestia shell drawers toggle sidebar
bind = , XF86AudioPlay, exec, caelestia shell mpris playPause
bind = , XF86AudioNext, exec, caelestia shell mpris next
bind = , XF86AudioPrev, exec, caelestia shell mpris previous
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movetoworkspace, -1
bind = $mainMod SHIFT, right, movetoworkspace, +1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

source = ~/.config/hypr/themes/colors.conf

